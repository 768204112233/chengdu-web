<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东商品导购</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box {
            width: 740px;
            height: 620px;
            margin: 30px auto;
            border-radius: 15px;
            border: 3px solid #4096ff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: red;
            margin-bottom: 15px;
        }
        .goods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            height: calc(100% - 45px);
        }
        .item {
            border: 10px groove #9966cc;
            box-shadow: 0 0 8px #ccc;
            text-align: center;
            padding: 8px;
        }
        .item:hover {
            border-style: dashed;
            border-color: #9999cc;
        }
        .name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .tip {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .price {
            color: red;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .item img {
            width: 100%;
            height: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>京东商品导购</h1>
        <div class="goods">
            <div class="item">
                <div class="name">麦包包 Vinhas单肩包</div>
                <div class="tip">领券满减</div>
                <div class="price">¥128</div>
                <img src="image5-2-1.jpg" alt="单肩包">
            </div>
            <div class="item">
                <div class="name">优购.adidas休闲鞋</div>
                <div class="tip">限时抢购</div>
                <div class="price">¥365</div>
                <img src="image5-2-2.jpg" alt="阿迪鞋">
            </div>
            <div class="item">
                <div class="name">优购.NB女子复古鞋</div>
                <div class="tip">限时抢购</div>
                <div class="price">¥299</div>
                <img src="image5-2-3.jpg" alt="NB鞋">
            </div>
            <div class="item">
                <div class="name">优购.VANS女子硫化鞋</div>
                <div class="tip">限时抢购</div>
                <div class="price">¥280</div>
                <img src="image5-2-4.jpg" alt="Vans鞋">
            </div>
            <div class="item">
                <div class="name">优购.匡威经典低帮鞋</div>
                <div class="tip">限时抢购</div>
                <div class="price">¥199</div>
                <img src="image5-2-5.jpg" alt="匡威鞋">
            </div>
            <div class="item">
                <div class="name">优购.Belle羊皮女鞋</div>
                <div class="tip">限时抢购</div>
                <div class="price">¥398</div>
                <img src="image5-2-6.jpg" alt="百丽女鞋">
            </div>
        </div>
    </div>
</body>
</html>
